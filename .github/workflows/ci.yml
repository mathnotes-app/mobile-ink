name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mobile-ink-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Package, native smoke, and example
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json

      - name: Install package dependencies
        run: npm ci

      - name: Typecheck package
        run: npm run typecheck

      - name: Run Jest tests
        run: npm test

      - name: Test release automation
        run: npm run test:release

      - name: Detect and reset native main-queue stalls
        run: npm run test:native:heartbeat-smoke

      - name: Verify background GPU preparation and CPU/GPU color parity
        run: npm run test:native:ganesh-preparation-smoke

      - name: Run native serialization smoke test
        run: npm run test:native:smoke

      - name: Run eraser cursor regression test
        run: npm run test:native:eraser-smoke

      - name: Run selection history regression test
        run: npm run test:native:selection-smoke

      - name: Run drawing snapshot regression test
        run: npm run test:native:snapshot-smoke

      - name: Run zoom surface regression test
        run: npm run test:native:zoom-smoke

      - name: Set up Java for document JNI regression test
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run continuous document JNI regression test
        run: npm run test:native:document-jni

      - name: Build package artifacts
        run: npm run build

      - name: Check npm package contents
        run: npm pack --dry-run --ignore-scripts

      - name: Install example dependencies
        run: npm ci --prefix example

      - name: Typecheck example
        run: npm run test:example:typecheck

      - name: Export example iOS bundle
        run: npm run test:example:export:ios
